name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nelyx_test
          POSTGRES_PASSWORD: nelyx_test
          POSTGRES_DB: nelyx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nelyx_test:nelyx_test@localhost:5432/nelyx_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar el cliente de Prisma
        run: npx prisma generate

      - name: Verificar tipos (TypeScript)
        run: npx tsc --noEmit -p .

      # Solo las dependencias de producción (--omit=dev): el toolchain de
      # desarrollo (vitest/tailwind/eslint) nunca corre en el servidor real,
      # así que sus vulnerabilidades no son parte de la superficie de ataque
      # de la app. Solo falla en "critical" — los hallazgos "high" conocidos
      # (xlsx: solo corre en el navegador del propio dueño sobre su propio
      # archivo; postcss/next: solo en build, sin fix sin un salto de major
      # versión) quedan documentados en docs/SECURITY_SCAN_2026-10-06.md en
      # vez de bloquear cada PR con ruido ya aceptado.
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=critical

      # Mismas reglas community que el escaneo manual original (ver
      # docs/SECURITY_SCAN_2026-10-06.md), pero corriendo en cada PR en vez
      # de una sola vez a mano. CLI directo (pip install) en vez de una
      # Action de terceros, para controlar exactamente los flags. Solo
      # falla en severidad ERROR (--severity repetible + --error): de las
      # ~47 coincidencias reales de esa auditoría ninguna era ERROR, y la
      # regla ruidosa (jsx-not-internationalized, 640 de 687 hallazgos) es INFO.
      - name: Escaneo de seguridad estático (Semgrep)
        run: |
          pip install semgrep
          semgrep scan --config=p/javascript --config=p/typescript --config=p/secrets --severity=ERROR --error app lib components middleware.ts

      - name: Aplicar el schema a la base de datos de pruebas
        run: npx prisma db push --skip-generate

      - name: Correr tests
        run: npx vitest run
