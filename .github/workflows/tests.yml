name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nelyx_test
          POSTGRES_PASSWORD: nelyx_test
          POSTGRES_DB: nelyx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nelyx_test:nelyx_test@localhost:5432/nelyx_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar el cliente de Prisma
        run: npx prisma generate

      - name: Verificar tipos (TypeScript)
        run: npx tsc --noEmit -p .

      # tsc solo (con strict: false) no agarra todo lo que next build sí:
      # límites "use client"/"use server" rotos, imports server-only dentro
      # de un client component, etc. — errores que solo aparecen al compilar
      # para producción de verdad. Corre con el mismo DATABASE_URL mínimo
      # del resto del job (ya probado: no hace falta ningún secreto más).
      - name: Compilar para producción (next build)
        run: npm run build

      # Solo las dependencias de producción (--omit=dev): el toolchain de
      # desarrollo (vitest/tailwind/eslint) nunca corre en el servidor real,
      # así que sus vulnerabilidades no son parte de la superficie de ataque
      # de la app. Solo falla en "critical" — los hallazgos "high" conocidos
      # (xlsx: solo corre en el navegador del propio dueño sobre su propio
      # archivo; postcss/next: solo en build, sin fix sin un salto de major
      # versión) quedan documentados en docs/SECURITY_SCAN_2026-10-06.md en
      # vez de bloquear cada PR con ruido ya aceptado.
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=critical

      # Mismas reglas community que el escaneo manual original (ver
      # docs/SECURITY_SCAN_2026-10-06.md), pero corriendo en cada PR en vez
      # de una sola vez a mano. CLI directo (pip install) en vez de una
      # Action de terceros, para controlar exactamente los flags. Solo
      # falla en severidad ERROR (--severity repetible + --error): de las
      # ~47 coincidencias reales de esa auditoría ninguna era ERROR, y la
      # regla ruidosa (jsx-not-internationalized, 640 de 687 hallazgos) es INFO.
      - name: Escaneo de seguridad estático (Semgrep)
        run: |
          pip install semgrep
          semgrep scan --config=p/javascript --config=p/typescript --config=p/secrets --severity=ERROR --error app lib components middleware.ts

      - name: Aplicar el schema a la base de datos de pruebas
        run: npx prisma db push --skip-generate

      - name: Correr tests
        run: npx vitest run

  # Job separado e informativo: corre la suite E2E (tests/e2e/, Playwright)
  # contra un navegador real. "Informativo" = continue-on-error en el job,
  # para que el resultado se vea en cada PR sin bloquear el merge todavía
  # — la idea es dejarlo correr ~2 semanas en este runner real antes de
  # pasarlo a bloqueante (ver tests/e2e/README.md sobre la flakiness
  # conocida de venta.spec.ts, ya mitigada con 1 retry en playwright.config.ts).
  e2e:
    name: E2E (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nelyx_test
          POSTGRES_PASSWORD: nelyx_test
          POSTGRES_DB: nelyx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nelyx_test:nelyx_test@localhost:5432/nelyx_test
      # Solo para el servidor de Next que levanta Playwright en este job —
      # ningún dato real, nunca se usa fuera de esta corrida de CI.
      NEXTAUTH_SECRET: e2e-ci-test-secret-no-es-un-secreto-real
      NEXTAUTH_URL: http://localhost:3109
      AUTH_URL: http://localhost:3109
      NEXT_PUBLIC_APP_URL: http://localhost:3109
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar el cliente de Prisma
        run: npx prisma generate

      - name: Aplicar el schema a la base de datos de pruebas
        run: npx prisma db push --skip-generate

      - name: Semilla de datos para E2E (cuenta + producto de prueba)
        run: npm run test:e2e:seed

      # Cachea el binario de Chromium entre corridas (evita descargarlo de
      # nuevo en cada PR). Las dependencias de sistema (apt) que necesita
      # para correr no viven en esta carpeta, así que se instalan aparte
      # abajo — rápido con cache-hit, completo (--with-deps) sin él.
      - name: Cache de navegadores de Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar navegador Chromium (con dependencias del sistema)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Instalar dependencias del sistema para Playwright
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Correr tests E2E (Playwright)
        run: npx playwright test

      # Trace y screenshot de cualquier test que falle (retain-on-failure /
      # only-on-failure en playwright.config.ts) — para poder revisar qué
      # pasó sin tener que reproducirlo localmente.
      - name: Subir evidencia de fallos (traces/screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

      # Capturas de responsive.spec.ts (celular/tablet/escritorio) — se
      # suben siempre, pasen o fallen los tests: son para revisión manual
      # ("¿se ve bien?"), no algo que el chequeo automático pueda
      # garantizar por sí solo (ver tests/e2e/responsive.spec.ts).
      - name: Subir capturas responsive (revisión manual)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-responsive
          path: capturas-responsive/
          retention-days: 14
          if-no-files-found: ignore
