name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nelyx_test
          POSTGRES_PASSWORD: nelyx_test
          POSTGRES_DB: nelyx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nelyx_test:nelyx_test@localhost:5432/nelyx_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar el cliente de Prisma
        run: npx prisma generate

      - name: Verificar tipos (TypeScript)
        run: npx tsc --noEmit -p .

      - name: Aplicar el schema a la base de datos de pruebas
        run: npx prisma db push --skip-generate

      - name: Correr tests
        run: npx vitest run
